name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: glide-dock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: glide-dock/src-tauri
      - run: npm install
      - name: UI tests (calculator, conversions, calendar parsing)
        run: node --test tests/lib.test.mjs
      - name: Rust tests (settings, allow-list, search scoring)
        working-directory: glide-dock/src-tauri
        run: cargo test --lib
      - name: Build (release exe + installer)
        run: npx tauri build
      - name: Smoke test and resource report
        shell: pwsh
        run: ./scripts/smoke.ps1 | Tee-Object -FilePath smoke.txt
      - name: Screenshot of the desktop
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process src-tauri/target/release/glide-dock.exe -PassThru; Start-Sleep 15
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("desktop.png"); Stop-Process -Id $p.Id -Force; Start-Sleep 1
          Start-Process src-tauri/target/release/glide-dock.exe -ArgumentList "--cleanup" -Wait
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/GlideDock | Out-Null
          Copy-Item src-tauri/target/release/glide-dock.exe portable/GlideDock/GlideDock.exe
          Set-Content portable/GlideDock/portable.txt "This file makes Glide Dock keep its settings in the 'data' folder next to it."
          Copy-Item README.md, LICENSE portable/GlideDock/
          Compress-Archive -Path portable/GlideDock -DestinationPath GlideDock-portable.zip -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glide-dock-windows
          path: |
            glide-dock/src-tauri/target/release/bundle/nsis/*.exe
            glide-dock/GlideDock-portable.zip
            glide-dock/smoke.txt
            glide-dock/desktop.png
